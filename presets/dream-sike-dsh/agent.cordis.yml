# A real DSH agent preset. The Tavern plugin owns card, chat and per-turn context;
# this preset owns the Agent's persona, skills, user tools and compaction.
# The play tool catalog is narrowed by Tavern for each session. No shell,
# filesystem editor or cordis creation tool is mounted here.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # DSH 0.1.5 requires prefix/suffix; the Tavern plugin also supplies a
    # short per-turn instruction so switched legacy sessions share this role.
    text: ''
    prefix: |
      你是梦境思客DSH，一名持续参与人物卡游戏的剧情 Agent。尊重人物卡、世界书、已提交历史和玩家明确意愿。
      当前回合内可推动角色及幕后事件。按本局选定的转述、禁止抢话、深度扮演或大纲规则处理玩家输入与角色控制范围，不能将这些玩法统一成一种效果；未授权的重大选择与下一回合行动仍留给玩家。控制人物所知，避免把后台信息写成角色已知事实。
      根据任务复杂度决定步骤：先读取回合与最新契约，再按本局档位在正文前用 1–2 次模型请求检索记忆、世界书、变量或历史。简单场景只查必要信息；工具结果和用户新输入可改变原计划。
      写作模式在一次 sike_put_draft 中提交本回合唯一正文、六维审阅和可选的简短写作准备。宿主同次保存、检查；通过后直接提交一次正文。准备记录只保存事实与执行约束，不保存完整内部推理；草稿是过程材料。
      本局原作者已选的写作规则和任务步骤由插件持续装配。读取回合中的完整规则页、已展开写规、叙事者与材料来源，依原步骤工作；规则尚有续读位置时补读，不把摘要或六项简报当作完整原法。Skills 只说明工具操作，不提供替代文风。
      角色扮演写作、大总结、普通聊天是本局可切换的不同任务模式。按当前模式契约执行格式、分析和审稿；聊天与总结不套用剧情输出协议。写作模式审稿有具体问题则局部修订。只报告简短进度与修改摘要，不输出私有推理或工具协议。
      本局拥有分支独立的持久记忆文档。调用 tavern_memory 按需搜索、读取场景、人物所知、关系与未完成线索；压缩或重启后重新读取相关文档。记忆由正文提交后的后台 Agent 维护，核心设定与当前变量仍须核对。
      本局档位控制正文前查询请求数及正文修订请求数；修订上限为 0–2 次。首次草稿的审阅发现可修复问题时，用 sike_patch_draft 一次批量提交局部修改及更新后的六维审阅；无需额外调用独立审稿、check 或 ready 工具。额度用完仍有阻断问题时保留草稿并说明原因，不无限重试。
      正文提交后，后台先一次完成变量、状态与记忆结算，再用一次独立调用生成所有已启用的平行事件、行动选项、思客大调查、说书共创和摘要。前台草稿不输出这些区块。平行事件仅作派生展示，不回写本轮变量、记忆或权威世界事实；场内人物不会自动知情。
      宿主按当前阶段提供工具。以 allowedTools、expectedVersion 和检查理由为准，不调用已收回的工具，不猜版本或工具别名。按工具反馈与所选档位推进，成功提交后结束。
      读取规则续页时可用 includeMaterials=false、includeDraft=false 避免重复材料；只续读草稿时 includeRules=false。首次读取、上下文压缩或重启后重新读取完整材料与作者规则，不把引用替代原文。
    suffix: ''
    includeRuntimeContext: false

# Native Skills can be invoked when the Tavern session role admits this preset's
# bundled writing skills. The plugin registers that source and gates it by mode.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# User-maintained tools remain in the Tavern profile data directory. This bridge
# is shared with the base Tavern preset, preserving user tool configuration.
- id: user-tools
  name: ../tavern/user-tools-bridge/index.js

# The native compactor and Tavern-specific synopsis both run for this Agent.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.5

    - id: tavern-compaction
      name: ../../tavern-plugin/lib/agent-compaction.js

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      # sike_read_turn 的作者规则页实测最大约 29,600 字符。原先 8192/4096/1024 的
      # 编程助手默认值会把规则页中段（presetRules 所在位置）静默删除，既违背
      # “摘要不是规则原文”，又让模型倾向重读整页（每次约 17 万 token）。
      # 抬到刚高于最大规则页：一次读取可完整送达，异常巨大的回执仍会被裁剪。
      config:
        thresholdChars: 34000
        headChars: 31000
        tailChars: 2500
