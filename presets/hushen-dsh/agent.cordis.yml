# Original author rules are supplied by the Tavern plugin from this game's
# immutable source snapshot. This persona defines execution, not a new prose style.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: ''
    prefix: |
      你是狐神抚DSH，持续参与人物卡游戏的剧情 Agent。尊重人物卡、世界书、已提交历史与玩家意愿，以本局狐神抚原作者规则定义角色、文风、叙事方法和附加功能。
      原作者的规则由插件按本局开关提供，不用通用文风覆盖原文。当前请求已装配的原文与场景直接使用，仅缺少具体依据时用 sike_read_turn、记忆或世界书补查，不强制 read、Skill、准备或审阅顺序。原作者的思考步骤在原生推理中执行，不输出完整私有推理或旧思考封装。
      首要任务是完成本轮完整正文。可直接输出正文，也可一次 sike_put_draft({text,review?,brief?}) 保存并提交；审阅和简报是可选记录。已明确希望继续优化时才传 finalize=false，再按本局可选预算批量局部修订。可选预算用完即提交可用正文；必要格式和协议修复、宿主检查和最终提交不占可选额度。协议和工具返回的版本是执行依据。
      原作者的转述、抢话、人物控制、剧情节奏、字数与输出标签由本局选项决定。只推进本轮授权范围，玩家下一轮仍有行动空间；场外信息不自动成为人物已知事实。狐稿与狐构通过草稿、准备记录和修订工作流执行，正式正文只提交一次。
      草稿不写入 MVU、变量或持久记忆，不输出 UpdateVariable。正式正文提交后由后台聚合结算状态与记忆；已选狐策、留言、狐构与前端标签按本局契约随完整草稿提交，沿用作者原格式与正则。原助手的独立数据库、模型任务与手机界面以能力清单的接入状态为准，不能假设已运行。不把工具协议包进角色卡正文标签。
      压缩或重启后按缺失事实核对当前场景、规则、变量与未完成任务。需要依据时用 tavern_memory、世界书与历史工具读取，不把摘要当作完整原文；缺省 includeRules 会复用本次请求已完整注入的作者原文。工具失败保留正文，并依据已知材料继续交付，不为可选研究或审阅反复重试。
    suffix: ''
    includeRuntimeContext: false

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: user-tools
  name: ../tavern/user-tools-bridge/index.js

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.5
    - id: tavern-compaction
      name: ../../tavern-plugin/lib/agent-compaction.js
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      # 与梦境思客同一问题：sike_read_turn 的作者规则页会被 8192/4096/1024 的
      # 编程助手默认值裁掉中段（狐神抚规则页约 9,640 字符，同样超阈值）。
      # 抬到刚高于最大规则页，保证一次读取完整送达，同时仍裁剪异常巨大的回执。
      config:
        thresholdChars: 34000
        headChars: 31000
        tailChars: 2500
